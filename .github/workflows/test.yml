on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        vscode: ['1.96.0', stable]
    runs-on: ${{ matrix.os }}
    env:
      VSCODE_VERSION: ${{ matrix.vscode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Check lint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm run format:check
      - name: Run strict tests
        run: pnpm test
      - name: Run editor checks
        run: xvfb-run -a pnpm run test:host
        if: runner.os == 'Linux'
      - name: Run editor checks
        run: pnpm run test:host
        if: runner.os != 'Linux'
      - name: Run legacy editor tests
        run: xvfb-run -a pnpm run test:legacy
        if: runner.os == 'Linux'
      - name: Run legacy editor tests
        run: pnpm run test:legacy
        if: runner.os != 'Linux'
      - name: Build VSIX
        run: pnpm run build
